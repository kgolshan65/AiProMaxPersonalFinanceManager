{% extends "base.html" %}

{% block title %}ورود | حساب یار{% endblock %}

{% block content %}
<div class="banner">
    <i class="bi bi-graph-up-arrow fs-4"></i>
    <div>
        <strong>به حساب یار خوش آمدید</strong>
        <div class="small">مدیریت هوشمند دارایی‌ها، کارت‌ها و تراکنش‌های شما</div>
    </div>
</div>
<div class="login-box">
    <h2 class="mb-3"><i class="bi bi-shield-lock"></i> ورود به حساب</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-100 mt-2"><i class="bi bi-box-arrow-in-right"></i> ورود</button>
    </form>
</div>
{% endblock %}
